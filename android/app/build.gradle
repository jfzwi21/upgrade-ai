apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
apply plugin: "kotlin-kapt"
apply plugin: 'io.objectbox'

// Do not reuse the upstream Firebase app configuration for the new Upgrade AI application ID.
def googleServicesFile = file("google-services.json")
def expectedFirebasePackage = "com.upgradeai.mobile"
def hasMatchingFirebaseConfig = false
if (googleServicesFile.exists()) {
    try {
        def googleServices = new groovy.json.JsonSlurper().parse(googleServicesFile)
        hasMatchingFirebaseConfig = googleServices.client?.any { client ->
            client.client_info?.android_client_info?.package_name == expectedFirebasePackage
        } ?: false
    } catch (Exception exception) {
        logger.warn("Unable to read ${googleServicesFile}; Firebase plugins will be skipped.")
    }
}
if (hasMatchingFirebaseConfig) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.warn("Skipping Firebase plugins: add a google-services.json client for ${expectedFirebasePackage} to enable Firebase.")
}

apply from: "../../node_modules/react-native-config/android/dotenv.gradle"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    // The app must start offline and must not wait for Metro in a Debug APK.
    // React Native 0.81 skips bundling debuggable variants by default; an empty list enables it.
    debuggableVariants = []
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.anythingllm"
    defaultConfig {
        applicationId "com.upgradeai.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode (project.findProperty("UPGRADE_AI_VERSION_CODE")?.toString()?.toInteger() ?: 94)
        versionName (project.findProperty("UPGRADE_AI_VERSION_NAME")?.toString() ?: "1.3.3")
        ndk {
            abiFilters "arm64-v8a"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file("upgradeai-upload-key.keystore")
            storePassword project.env.get("APP_RELEASE_STORE_PASSWORD")
            keyAlias "upgradeai-keystore"
            keyPassword project.env.get("APP_RELEASE_KEY_PASSWORD")
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // Ship native debug symbols in the AAB so Play Console can symbolicate native (llama.rn) crashes
            ndk { debugSymbolLevel 'FULL' }
        }
    }

    aaptOptions {
        noCompress "bin", "json"
        // Default AAPT ignore pattern plus the llama.rn Hexagon DSP blobs, which its gradle
        // plugin copies into src/main/assets/ggml-hexagon on every build. We are CPU-only.
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~:!ggml-hexagon:!libggml-htp-*.so"
    }

    packagingOptions {
        jniLibs {
            // llama.rn ships one full llama.cpp build per CPU feature set (~10MB each) and picks
            // one at runtime in RNLlama.java, falling through when a variant is missing.
            // We keep: dotprod+i8mm (2020+ SoCs), dotprod (2018-2020 SoCs), and the generic
            // librnllama.so / librnllama_jni.so which the loader always needs as a fallback.
            // Hexagon/OpenCL offload is intentionally not shipped (CPU-only app).
            excludes += [
                "**/librnllama_v8.so",
                "**/librnllama_jni_v8.so",
                "**/librnllama_v8_2.so",
                "**/librnllama_jni_v8_2.so",
                "**/librnllama_v8_2_i8mm.so",
                "**/librnllama_jni_v8_2_i8mm.so",
                "**/librnllama_v8_2_dotprod_i8mm_hexagon_opencl.so",
                "**/librnllama_jni_v8_2_dotprod_i8mm_hexagon_opencl.so",
            ]
            // Extract .so files to lib/<abi> on install. On x86_64 devices with ARM translation
            // (ChromeOS, WSA, emulators) SoLoader otherwise looks for lib/x86_64 inside the APKs,
            // misses our arm64-only libs and crashes on launch finding libreactnative.so.
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    //implementation("com.facebook.react:flipper-integration")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    
    // for download manager
    implementation "androidx.work:work-runtime-ktx:2.9.0"
    def room_version = "2.8.5"  // 2.6.x cannot read Kotlin 2.1 class metadata under kapt
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    // Custom Tabs for OAuth sign-in (LoopbackAuthModule - Sign in with ChatGPT)
    implementation "androidx.browser:browser:1.8.0"
    // Used only for text extraction from uploaded PDFs (PdfParserModule). BouncyCastle is
    // needed just for public-key encrypted / signed PDFs, which we reject anyway; dropping it
    // saves ~8MB of installed size.
    implementation('com.tom-roush:pdfbox-android:2.0.27.0') {
        exclude group: 'org.bouncycastle'
    }
    
    // Add Guava dependency for ListenableFuture
    implementation 'com.google.guava:guava:32.1.3-android'
}

